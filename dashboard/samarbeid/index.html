const KEY = "loff-dashboard-passord";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: bytes(BOX.salt), iterations: 600000, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(BOX.iv)}, key, bytes(BOX.data));
  document.open(); document.write(new TextDecoder().decode(plain)); document.close();
}
const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const saved = (() => { try { return (store && store.getItem(KEY)) || sessionStorage.getItem(KEY); } catch (e) { return null; } })();
if (saved) unlock(saved).catch(() => {});
document.getElementById("unlock").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("password").value;
  const btn = ev.target.querySelector("button"); btn.disabled = true; btn.textContent = "Låser opp …";
  try {
    try { (document.getElementById("remember").checked && store ? store : sessionStorage).setItem(KEY, pw); } catch (e) {}
    await unlock(pw);
  } catch (e) {
    try { sessionStorage.removeItem(KEY); store && store.removeItem(KEY); } catch (err) {}
    document.getElementById("error").textContent = "Feil passord. Prøv igjen.";
    btn.disabled = false; btn.textContent = "Lås opp";
  }
});
</script></body></html>
